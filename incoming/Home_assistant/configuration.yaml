# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - "::1"
    - 172.17.0.2
    - 172.17.0.0/16
    - 192.168.0.0/16
    - 10.0.0.0/8

homeassistant:
  allowlist_external_dirs:
    - /config/www

shell_command:
# Trigger backup in the background
  run_ha_backup: "ssh -o StrictHostKeyChecking=no -i /config/ssh_keys/id_rsa..."
# God Mode: Restart Nextcloud
  restart_nextcloud: "ssh -o StrictHostKeyChecking=no -i /config/ssh_keys/id_rsa..."
# God Mode: Restart CCTV
  restart_cctv: "ssh -o StrictHostKeyChecking=no -i /config/ssh_keys/id_rsa..."
# Export Flight Data to CSV
  export_flight: >
    sh -c "echo '{{ log_data }}' >> /config/www/flight_history.csv"
# Auto-Delete old flights (Keeps only the newest 1000 lines)
  cleanup_flight_log: >
    sh -c "tail -n 1000 /config/www/flight_history.csv > /config/www/tmp.csv && mv /config/www/tmp.csv /config/www/flight_history.csv"
# Auto-Delete old helicopters (Keeps only the newest 1000 lines)
  cleanup_helicopter_log: >
    sh -c "tail -n 1000 /config/www/helicopter_history.csv > /config/www/tmp_heli.csv && mv /config/www/tmp_heli.csv /config/www/helicopter_history.csv"

command_line:
  - sensor:
      name: "RPi5 Fan Speed"
      command: "ssh -o StrictHostKeyChecking=no -i /config/ssh_keys/id_rsa redwannabil@127.0.0.1 'cat /sys/devices/platform/cooling_fan/hwmon/hwmon*/fan1_input 2>/dev/null || echo 0'"
      unit_of_measurement: "RPM"
      scan_interval: 15
  - sensor:
      name: "Main NVMe Health"
      command: "cat /config/nvme_health.txt"
      unit_of_measurement: "%"
      icon: mdi:harddisk
      scan_interval: 60
      
  - sensor:
      name: "CCTV SSD Health"
      command: "cat /config/sda_health.txt"
      unit_of_measurement: "%"
      icon: mdi:harddisk
      scan_interval: 60

mqtt:
  binary_sensor:
    - name: "CSI Room Occupancy"
      state_topic: "home/room/occupancy"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: occupancy

recorder:
  purge_keep_days: 2 # Only keep 2 days of history instead of 10
  commit_interval: 30 # Group writes together every 30 seconds
  exclude:
    domains:
      - sun
      - weather
      - camera
      - update
    entities:
      - sensor.time
      - sensor.date

template:
  - trigger:
      - platform: event
        event_type: flightradar24_exit
    sensor:
      - unique_id: local_airspace_surveillance_history
        name: "Airspace Surveillance Log (10km)"
        state: >-
          {% set flight = trigger.event.data %}
          {{ flight.time_real_departure | default(now().timestamp(), true) | timestamp_custom('%H:%M') }} - {{ flight.aircraft_model }} ({{ flight.airline_short | default('Unknown') }})
        attributes:
          flights: >-
            {% set n = 200 %} 
            {% set m = this.attributes.flights | count | default(0) %}
            {{ [ trigger.event.data ] + 
               ( [] if m == 0 else 
                 this.attributes.flights[0:n-1] )
            }}
          icon: mdi:plane
  - trigger:
      - platform: state
        entity_id: sensor.flightradar24_helicopters_in_area
        attribute: flights
    sensor:
      - name: "Helicopter Surveillance Log 10km"
        unique_id: helicopter_surveillance_log_10km
        icon: mdi:history
        state: "{{ trigger.to_state.state }}"
        attributes:
          flights: >
            {% set saved_history = this.attributes.flights | default([], true) %}
            {% set saved_ids = saved_history | map(attribute='id') | list %}
            {% set new_flights = trigger.to_state.attributes.flights | default([], true) %}
            {% set ns = namespace(new_arrivals=[]) %}
            
            {% for flight in new_flights %}
              {% if flight.id not in saved_ids %}
                {% set ns.new_arrivals = ns.new_arrivals + [flight] %}
              {% endif %}
            {% endfor %}
            
            {{ (ns.new_arrivals + saved_history)[:15] }}
  - sensor:
      # --- FASTING TIMES ---
      - name: "Next Sahri Ends"
        icon: mdi:weather-night
        state: "{{ states('sensor.islamic_prayer_times_fajr_prayer') }}"
      - name: "Next Iftar"
        icon: mdi:weather-sunset-down
        state: "{{ states('sensor.islamic_prayer_times_maghrib_prayer') }}"
        
      # --- DYNAMIC WAQT & PROHIBITED TIME LOGIC ---
      - name: "Active Waqt Details"
        state: >
          {% set now = as_timestamp(now()) %}
          {% set f = as_timestamp(states('sensor.islamic_prayer_times_fajr_prayer'), 0) %}
          {% set s = as_timestamp(states('sensor.islamic_prayer_times_sunrise_time'), 0) %}
          {% set d = as_timestamp(states('sensor.islamic_prayer_times_dhuhr_prayer'), 0) %}
          {% set a = as_timestamp(states('sensor.islamic_prayer_times_asr_prayer'), 0) %}
          {% set m = as_timestamp(states('sensor.islamic_prayer_times_maghrib_prayer'), 0) %}
          {% set i = as_timestamp(states('sensor.islamic_prayer_times_isha_prayer'), 0) %}
          
          {% if f == 0 %} Calculating...
          {% elif now >= s and now < (s + 900) %} 🚫 PROHIBITED (Sunrise)
          {% elif now >= (d - 600) and now < d %} 🚫 PROHIBITED (Zawal)
          {% elif now >= (m - 900) and now < m %} 🚫 PROHIBITED (Sunset)
          {% elif now < f %} Tahajjud
          {% elif now < s %} Fajr
          {% elif now < d %} Ishraq / Duha
          {% elif now < a %} Dhuhr
          {% elif now < m %} Asr
          {% elif now < i %} Maghrib
          {% else %} Isha
          {% endif %}

      # --- HUMAN READABLE COUNTDOWN (Hours & Mins) ---
      - name: "Time Until Next Event Formatted"
        icon: mdi:timer-sand
        state: >
          {% set now = as_timestamp(now()) %}
          {% set times = [
            as_timestamp(states('sensor.islamic_prayer_times_fajr_prayer'), 0),
            as_timestamp(states('sensor.islamic_prayer_times_sunrise_time'), 0) + 900,
            as_timestamp(states('sensor.islamic_prayer_times_dhuhr_prayer'), 0),
            as_timestamp(states('sensor.islamic_prayer_times_asr_prayer'), 0),
            as_timestamp(states('sensor.islamic_prayer_times_maghrib_prayer'), 0),
            as_timestamp(states('sensor.islamic_prayer_times_isha_prayer'), 0)
          ] %}
          {% set future_times = times | select('>', now) | list %}
          {% set next_time = future_times[0] | default(now + 86400) %}
          {% set mins = ((next_time - now) / 60) | int %}
          {% set h = (mins / 60) | int %}
          {% set m = mins % 60 %}
          {% if h > 0 %}{{ h }} hr {{ m }} min{% else %}{{ m }} min{% endif %}

      # --- GAUGE PERCENTAGE (0 to 100%) ---
      - name: "Waqt Progress Percentage"
        unit_of_measurement: "%"
        state: >
          {% set now = as_timestamp(now()) %}
          {% set times = [
            as_timestamp(states('sensor.islamic_prayer_times_fajr_prayer'), 0),
            as_timestamp(states('sensor.islamic_prayer_times_sunrise_time'), 0),
            as_timestamp(states('sensor.islamic_prayer_times_dhuhr_prayer'), 0),
            as_timestamp(states('sensor.islamic_prayer_times_asr_prayer'), 0),
            as_timestamp(states('sensor.islamic_prayer_times_maghrib_prayer'), 0),
            as_timestamp(states('sensor.islamic_prayer_times_isha_prayer'), 0)
          ] %}
          {% set past_times = times | select('<', now) | list %}
          {% set future_times = times | select('>', now) | list %}
          {% set start = past_times | last | default(now - 3600) %}
          {% set end = future_times | first | default(now + 3600) %}
          {% set total = end - start %}
          {% set elapsed = now - start %}
          {{ ((elapsed / total) * 100) | int }}
notify:
  - name: export_flight_history
    platform: file
    filename: /config/www/flight_history.csv
    timestamp: false
  - name: helicopter_csv_logger
    platform: file
    # FIXED PATH TO ALLOW HA TO CREATE THE SERVICE
    filename: /config/www/helicopter_history.csv
    timestamp: false

zone:
  - name: "10km Airspace Dome"
    latitude: 23.6991875
    longitude: 90.4531719
    radius: 10000
    icon: mdi:radar

geo_location:
  - platform: usgs_earthquakes_feed
    feed_type: "past_week_m45_earthquakes"
    radius: 1500
    minimum_magnitude: 4.5
    latitude: 23.6991875
    longitude: 90.4531719
