name: AI Portfolio Architect

on:
  push:
    paths:
      - 'incoming/**'

concurrency:
  group: ai-portfolio-${{ github.ref }}
  cancel-in-progress: true

# This silences the Node 20 deprecation warning by opting into Node 24 early
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: pip install openai
      
      - name: Run AI Architect
        env:
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: python .github/scripts/ai_architect.py
      
      - name: Commit and push portfolio updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "🤖 AI Automated Portfolio Build (GitHub Native AI)"

          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 2
          done

          echo "Failed to push after 3 attempts."
          exit 1
